<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtEcho | 創作者空間</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/author_space.css">
    <script src="js/authGuard.js"></script>
</head>
<body>
<div class="page-shell">
    <header class="site-header">
        <nav class="nav-wrap">
            <a class="brand" href="index.html" aria-label="ArtEchoO"></a>
            <div class="nav-links">
                <a class="nav-btn" href="index.html">主頁</a>
                <a class="nav-btn" href="Gallery.html">個人雲端藝術庫</a>
                <a class="nav-btn" href="Story.html">劇情繪畫</a>
                <a class="nav-btn" href="Cloud_space.html">公開藝術畫廊</a>
                <a class="nav-btn" href="login.html">登入</a>
            </div>
        </nav>
    </header>

    <main>
        <a href="Cloud_space.html" class="back-link">← 返回公開畫廊</a>

        <div class="author-hero reveal delay-1">
            <div class="author-cover" id="authorCover">
                <div class="cover-overlay"></div>
            </div>
            <div class="author-profile">
                <div class="author-avatar" id="authorAvatar">作</div>
                <div class="author-info">
                    <h1 id="authorNameTitle">載入中...</h1>
                    <p class="author-quote" id="authorQuote">「每一筆色彩，都是內心深處的迴聲。」</p>
                    <div class="author-stats" id="authorStats">
                    </div>
                </div>
            </div>
        </div>

        <section class="panel reveal delay-2">
            <div class="section-header">
                <h2>個人展覽牆</h2>
            </div>
            <div id="authorWorksGrid" class="author-gallery-grid" aria-live="polite">
            </div>
        </section>
    </main>
</div>

<div class="art-modal-backdrop" id="authorModalBackdrop" style="display: none;">
    <div class="art-modal" role="dialog">
        <button class="art-modal-close" id="authorModalClose">✕</button>
        <img src="" alt="作品預覽" id="modalImg">
        <div class="art-modal-body">
            <h3 id="modalTitle"></h3>
            <div class="author" id="modalStoryTheme"></div>
            <div class="desc" id="modalDesc"></div>
            <div class="level-badge" id="modalLevel"></div>
        </div>
    </div>
</div>

<script src="js/author_space.js"></script>
</body>
</html>
