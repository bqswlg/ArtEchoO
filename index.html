<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ArtEcho | 用色彩回應情緒</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="CSS/styles.css">
	<script src="js/authGuard.js"></script>
</head>
<body>
<div class="page-shell">
	<header class="site-header">
		<nav class="nav-wrap" aria-label="主要導覽">
			<a class="brand" href="index.html"><span class="brand-dot" aria-hidden="true"></span>ArtEcho</a>
			<div class="nav-links">
				<a class="nav-btn active" href="index.html">主頁</a>
				<a class="nav-btn" href="Gallery.html">個人雲端藝術庫</a>
				<a class="nav-btn" href="Story.html">劇情繪畫</a>
				<a class="nav-btn" href="Cloud_space.html">公開藝術畫廊</a>
				<a class="nav-btn" href="login.html">登入</a>
			</div>
		</nav>
	</header>

	<main>
		<section class="hero reveal delay-1">
			<div class="hero-text">
				<h1>用色彩回應情緒，<br>讓畫面成為你心情日記</h1>
				<p>
					ArtEcho 是一個結合治癒感的創作空間，<br>
					你可以在作畫中與自己對話、抒發、療癒，<br>
					陪伴你把今天的情緒存成作品，慢慢照顧成長的過程。
				</p>
			</div>
			<div class="hero-image">
				<img src="images/Hero.png" alt="心情日記插畫">
			</div>
		</section>

		<section class="steps-grid reveal delay-2">
			<article class="step-card">
				<div class="step-icon">
					<svg class="hand-drawn" width="28" height="28" viewBox="0 0 24 24">
						<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
						<path d="M15 5l4 4"/>
					</svg>
				</div>
				<div class="step-content">
					<h3>1. 開始作畫</h3>
					<p>先選一個貼近當下心情的顏色，隨手在畫板塗鴉，無須擔心畫得像不像。</p>
				</div>
			</article>
			<article class="step-card">
				<div class="step-icon">
					<svg class="hand-drawn" width="28" height="28" viewBox="0 0 24 24">
						<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
						<path d="M2 22l8-8"/>
					</svg>
				</div>
				<div class="step-content">
					<h3>2. 命名情緒</h3>
					<p>替這段情緒命名，為它說一個名字，幫助你更靠近內在感受。</p>
				</div>
			</article>
			<article class="step-card">
				<div class="step-icon">
					<svg class="hand-drawn" width="28" height="28" viewBox="0 0 24 24">
						<path d="M6 6h12" />
						<path d="M7 6v12a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3V6" />
						<path d="M9 2h6" />
						<path d="M12 12.5 c-1-1-2.5-1-3 0 c-0.5 0.5-0.5 2 0.5 3 l2.5 2.5 l2.5-2.5 c1-1 1-2.5 0-3 C14.5 11.5 13 11.5 12 12.5 z" fill="#c66b3d" stroke="none"/>
					</svg>
				</div>
				<div class="step-content">
					<h3>3. 累積軌跡</h3>
					<p>將作品收藏起來，日後再看一看，感受自己如何慢慢變好。</p>
				</div>
			</article>
		</section>

		<section class="ticker-banner reveal delay-3">
			<button class="ticker-arrow prev" id="tickerPrevBtn" aria-label="上一則">❮</button>

			<div class="ticker-body">
				<div class="ticker-quote-mark">“</div>
				<div class="ticker-text-wrapper" role="status" aria-live="polite">
					<h3>今天的溫柔提醒</h3>
					<p id="careTickerText">我知道這不容易，但你會看到你撐起的，我們會一起慢慢練習</p>
				</div>
			</div>

			<div class="ticker-illustration">
				<img src="images/tricker.png" alt="溫柔提醒插圖">
			</div>

			<button class="ticker-arrow next" id="tickerNextBtn" aria-label="下一則">❯</button>
		</section>

		<section class="resources-section reveal delay-3" aria-label="官方健康資訊與資源">
			<div class="section-header">
				<h2>官方健康資訊與資源</h2>
				<button class="view-more-btn">查看更多資源</button>
			</div>

			<div class="carousel">
				<div class="carousel-images">
					<figure class="resource-card">
						<div class="resource-poster">
							<a href="https://sps.mohw.gov.tw/mhs" target="_blank" rel="noopener noreferrer">
								<img src="images/young_health.png" alt="青壯世代心理健康方案">
							</a>
						</div>
						<div class="resource-info">
							<h4>方案簡介</h4>
							<p>本方案提供 15歲至 45歲民眾心理諮商補助，幫助你獲得對話的力量，陪伴你慢慢好起來。</p>
							<ul class="info-list checkmark-list">
								<li><strong>服務對象：</strong>每人 3 次免費諮商</li>
								<li><strong>適用年齡：</strong>15-45 歲青壯年</li>
								<li><strong>使用方式：</strong>經專案評估入方案的諮商機構</li>
							</ul>
							<a href="images/115METHOD.pdf" class="download-btn" target="_blank" rel="noopener noreferrer">
								115年青壯世代心理健康支持方案.pdf <span class="download-icon">↓</span>
							</a>
						</div>
					</figure>
				</div>
				<div class="carousel-dots">
					<span class="dot active" data-index="0"></span>
					<span class="dot" data-index="1"></span>
				</div>
			</div>
		</section>
	</main>
</div>

<script src="js/index.js"></script>
</body>
</html>
